name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Install approved launcher artwork
        run: |
          test -s "file_000000000f60820a982e42bb48348703.png"
          mkdir -p app/src/main/res/drawable-nodpi
          cp "file_000000000f60820a982e42bb48348703.png" app/src/main/res/drawable-nodpi/bechir_launcher.png
      - name: Build APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BECHIR-FILES-PRO-debug
          path: app/build/outputs/apk/debug/app-debug.apk
