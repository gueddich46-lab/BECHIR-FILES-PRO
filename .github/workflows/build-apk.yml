name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Generate density-specific launcher icons from original PNG
        run: |
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path("file_000000000f60820a982e42bb48348703.png")
          if not source.is_file():
              raise SystemExit("Approved icon PNG is missing")
          original = Image.open(source).convert("RGBA")
          for density, size in (("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144), ("xxxhdpi", 192)):
              output = Path("app/src/main/res") / ("mipmap-" + density)
              output.mkdir(parents=True, exist_ok=True)
              original.resize((size, size), Image.Resampling.LANCZOS).save(output / "bechir_launcher.png", optimize=True)
          print("Created launcher icons from approved original:", original.size)
          PY
      - name: Build APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BECHIR-FILES-PRO-debug
          path: app/build/outputs/apk/debug/app-debug.apk
